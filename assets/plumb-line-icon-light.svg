<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!--
    Plumb Line Icon - Light Theme Variant (v2 - Revised)
    Dark mark on light background
  -->

  <!-- Background: Light warm neutral -->
  <rect width="1024" height="1024" fill="#F8F9FA"/>

  <!-- Top anchor cap -->
  <line
    x1="488"
    y1="160"
    x2="536"
    y2="160"
    stroke="#2C3E50"
    stroke-width="6"
    stroke-linecap="round"/>

  <!-- Vertical plumb line -->
  <line
    x1="512"
    y1="170"
    x2="512"
    y2="740"
    stroke="#2C3E50"
    stroke-width="8"
    stroke-linecap="round"/>

  <!-- Plumb weight -->
  <path
    d="M 512 740 L 470 810 Q 470 860, 512 890 Q 554 860, 554 810 Z"
    fill="#2C3E50"/>

  <!-- Subtle shadow -->
  <ellipse
    cx="512"
    cy="900"
    rx="28"
    ry="8"
    fill="#000000"
    opacity="0.06"/>
</svg>
