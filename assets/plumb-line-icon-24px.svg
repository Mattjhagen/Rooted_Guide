<?xml version="1.0" encoding="UTF-8"?>
<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!--
    Plumb Line Icon - 24px Optical Size (v3 Final)
    Ultra-simple geometry for reliable rasterization
    Glyph height: 18px (y=3 to y=21)
  -->

  <!-- Background -->
  <rect width="24" height="24" fill="#F8F9FA"/>

  <!-- Top cap -->
  <rect x="10" y="3" width="4" height="1.5" rx="0.75" fill="#2C3E50"/>

  <!-- Vertical line -->
  <rect x="11" y="4" width="2" height="13" fill="#2C3E50"/>

  <!-- Plumb weight -->
  <path d="M 12 17 L 10 20 Q 10 21, 12 21 Q 14 21, 14 20 Z" fill="#2C3E50"/>
</svg>
